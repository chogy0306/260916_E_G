{% extends "base.html" %}
{% block title %}급여대장 업로드{% endblock %}
{% block content %}
<h2 class="mb-4">급여대장 업로드</h2>
<form method="post" enctype="multipart/form-data" class="card p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="row mb-3">
    <div class="col-md-3">
      <label class="form-label">귀속 연도</label>
      <input type="number" name="payroll_year" class="form-control" value="{{ now.year if now else '' }}" required />
    </div>
    <div class="col-md-3">
      <label class="form-label">귀속 월</label>
      <input type="number" name="payroll_month" min="1" max="12" class="form-control" required />
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Excel 파일 (.xlsx, .xls)</label>
    <input type="file" name="file" class="form-control" accept=".xlsx,.xls" required />
  </div>
  <button type="submit" class="btn btn-primary">업로드</button>
</form>
{% endblock %}
