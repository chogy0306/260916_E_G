{% extends "base.html" %}
{% block title %}검증 기준 설정{% endblock %}
{% block content %}
<h2 class="mb-4">검증 기준 설정</h2>
<table class="table bg-white">
  <thead><tr><th>기준명</th><th>임계값</th><th>등급</th><th>활성화</th><th></th></tr></thead>
  <tbody>
    {% for rule in rules %}
    <form id="rule-form-{{ rule.id }}" method="post" action="{{ url_for('settings.update_rule', rule_id=rule.id) }}"></form>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" form="rule-form-{{ rule.id }}" />
    <tr>
      <td>{{ rule.rule_name }}<div class="text-muted small">{{ rule.rule_code }}</div></td>
      <td style="width:120px">
        <input form="rule-form-{{ rule.id }}" type="number" step="0.1" name="threshold" class="form-control" value="{{ rule.threshold }}" />
      </td>
      <td style="width:140px">
        <select form="rule-form-{{ rule.id }}" name="severity" class="form-select">
          {% for s in ['ERROR', 'WARNING', 'REVIEW'] %}
          <option value="{{ s }}" {{ 'selected' if rule.severity == s else '' }}>{{ s|severity_label }}</option>
          {% endfor %}
        </select>
      </td>
      <td class="text-center">
        <input form="rule-form-{{ rule.id }}" type="checkbox" name="is_active" {{ 'checked' if rule.is_active else '' }} />
      </td>
      <td><button form="rule-form-{{ rule.id }}" type="submit" class="btn btn-sm btn-primary">저장</button></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
