{% extends "base.html" %}
{% block title %}전월 데이터 선택{% endblock %}
{% block content %}
<h2 class="mb-4">{{ upload.period_label }} - 전월 데이터 비교 선택</h2>
<form method="post" class="card p-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <div class="mb-3">
    <label class="form-label">비교할 전월 급여대장 (선택 안 하면 전월 비교 없이 검증)</label>
    <select name="previous_upload_id" class="form-select">
      <option value="">비교 안 함</option>
      {% for u in other_uploads %}
      <option value="{{ u.id }}">{{ u.period_label }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit" class="btn btn-primary">검증 시작</button>
</form>
{% endblock %}
