{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <span class="login-logo-mark"></span>
      <span class="login-logo-text">이트너스</span>
    </div>

    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label class="form-label">아이디</label>
        <input type="text" name="username" class="form-control" placeholder="아이디를 입력하세요" autofocus required />
      </div>
      <div class="mb-4">
        <label class="form-label">비밀번호</label>
        <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
  </div>
</div>
{% endblock %}
